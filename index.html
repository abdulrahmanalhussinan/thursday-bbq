<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فعالية شواء الخميس</title>
<meta name="description" content="سجّل اسمك وطلبك من البرجر والمشروب لفعالية شواء الخميس">
<meta property="og:type" content="website">
<meta property="og:title" content="فعالية شواء الخميس">
<meta property="og:description" content="سجّل اسمك وطلبك من البرجر والمشروب">
<meta property="og:image" content="https://abdulrahmanalhussinan.github.io/thursday-bbq/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://abdulrahmanalhussinan.github.io/thursday-bbq/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#140d09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#140d09;
  --bg2:#1c130e;
  --card:#211711;
  --card2:#2a1d15;
  --line:#3b2a1f;
  --line2:#4d3627;
  --text:#fff3e6;
  --muted:#c3a892;
  --dim:#8d7462;
  --ember:#ff6b1a;
  --ember2:#ff8a2b;
  --amber:#ffc25a;
  --coal:#0d0806;
  --ok:#7fd88f;
  --danger:#ff6a5c;
  --radius:18px;
  --head:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255,107,26,.22), transparent 60%),
    radial-gradient(80% 40% at 100% 30%, rgba(255,194,90,.06), transparent 70%),
    var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:580px;margin:0 auto;padding:0 16px 56px}

/* ---------- hero ---------- */
.hero{position:relative;padding:44px 4px 26px;text-align:center;overflow:hidden}
.grate{
  position:absolute;inset:auto -20% 0 -20%;height:120px;
  background:repeating-linear-gradient(90deg, transparent 0 26px, rgba(255,140,60,.10) 26px 30px);
  -webkit-mask-image:linear-gradient(to top, #000 0%, transparent 100%);
          mask-image:linear-gradient(to top, #000 0%, transparent 100%);
  pointer-events:none;
}
.embers{position:absolute;inset:0;pointer-events:none}
.embers i{
  position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 10px 2px rgba(255,140,40,.8);
  opacity:0;animation:rise 6s linear infinite;
}
@keyframes rise{
  0%{transform:translate(0,0) scale(1);opacity:0}
  10%{opacity:.9}
  100%{transform:translate(var(--dx,20px),-220px) scale(.3);opacity:0}
}
@media (prefers-reduced-motion:reduce){.embers{display:none}}
.flame{width:64px;height:64px;margin:0 auto 10px;display:block;filter:drop-shadow(0 6px 20px rgba(255,107,26,.55))}
.flame .f1{animation:flick 1.6s ease-in-out infinite alternate;transform-origin:50% 100%}
.flame .f2{animation:flick 1.1s ease-in-out infinite alternate-reverse;transform-origin:50% 100%}
@keyframes flick{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.08) scaleX(.95)}}
.eyebrow{
  display:inline-block;font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:.2px;
  color:var(--amber);background:rgba(255,194,90,.09);border:1px solid rgba(255,194,90,.22);
  padding:5px 14px;border-radius:99px;margin-bottom:12px
}
h1{
  font-family:var(--head);font-weight:900;font-size:clamp(34px,9.5vw,50px);line-height:1.35;
  color:var(--text);text-shadow:0 0 34px rgba(255,107,26,.45), 0 2px 0 rgba(0,0,0,.4);
}
h1 span{color:var(--ember2)}
.sub{color:var(--muted);margin-top:8px;font-size:15px}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg, var(--card2), var(--card));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin-top:16px;position:relative;
  box-shadow:0 18px 40px -24px rgba(0,0,0,.8);
}
.card-title{
  font-family:var(--head);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:14px
}
.card-title .tag{
  margin-inline-start:auto;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:3px 10px
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ember);box-shadow:0 0 12px var(--ember)}

/* ---------- totals ---------- */
.big{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px dashed var(--line2)}
.big-num{font-family:var(--head);font-weight:900;font-size:64px;line-height:1;color:var(--amber);text-shadow:0 0 30px rgba(255,160,40,.35);font-variant-numeric:tabular-nums}
.big-lbl{font-family:var(--head);font-weight:700;font-size:18px}
.big-sub{color:var(--muted);font-size:14px}
.people{
  text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:96px
}
.people b{display:block;font-family:var(--head);font-weight:800;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.people small{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.tile{
  background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:12px 14px
}
.tile-h{display:flex;align-items:center;gap:10px}
.tile .ic{font-size:22px;line-height:1.2}
.tile .nm{font-family:var(--head);font-weight:700;font-size:16px}
.tile b{margin-inline-start:auto;display:inline-block;font-family:var(--head);font-weight:800;font-size:30px;line-height:1.2;color:var(--amber);font-variant-numeric:tabular-nums}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.pc{
  display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:3px 11px;overflow-wrap:anywhere
}
.pc em{font-style:normal;font-family:var(--head);font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);color:var(--ember2)}100%{transform:scale(1)}}
.sec-lbl{font-family:var(--head);font-weight:600;font-size:14px;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:99px;padding:5px 12px;font-size:14px;font-weight:500
}
.chip em{font-style:normal;font-family:var(--head);font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.none{color:var(--dim);font-size:14px}
.actions{display:flex;gap:10px;margin-top:18px}
.btn-ghost{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;
  background:rgba(255,255,255,.03);transition:background .2s, border-color .2s
}
.btn-ghost:hover{background:rgba(255,255,255,.07);border-color:var(--ember)}
.btn-ghost svg{width:18px;height:18px}

/* ---------- form ---------- */
label.fl{display:block;font-family:var(--head);font-weight:700;font-size:15px;margin:18px 0 8px}
label.fl:first-of-type{margin-top:0}
label.fl small{font-family:var(--body);font-weight:500;color:var(--dim);font-size:13px;margin-inline-start:6px}
.inp{
  width:100%;background:var(--coal);border:1px solid var(--line2);border-radius:12px;
  padding:12px 14px;font-size:16px;outline:none;transition:border-color .2s, box-shadow .2s
}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,107,26,.18)}
.item{
  border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:rgba(0,0,0,.18);
  transition:border-color .2s, background .2s
}
.item.on{border-color:rgba(255,107,26,.7);background:rgba(255,107,26,.07)}
.item-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.item-head .ic{font-size:22px}
.item-head b{font-family:var(--head);font-weight:700;font-size:16px}
.item-head .cnt{
  margin-inline-start:auto;font-family:var(--head);font-weight:800;font-size:14px;color:var(--bg);
  background:var(--amber);border-radius:99px;padding:2px 11px;min-width:30px;text-align:center
}
.item-head .clr{margin-inline-start:6px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;direction:ltr}
.num{
  height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);
  font-family:var(--head);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;
  transition:background .15s, border-color .15s, transform .1s
}
.num:active{transform:scale(.94)}
.num.sel{background:var(--ember);border-color:var(--ember);color:#fff;box-shadow:0 6px 16px -6px rgba(255,107,26,.8)}
@media (max-width:430px){.nums{grid-template-columns:repeat(5,1fr)}}
.drinks{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  border:1px solid var(--line2);border-radius:99px;padding:9px 16px;font-weight:600;font-size:15px;
  background:rgba(255,255,255,.03);transition:background .15s, border-color .15s
}
.pill.sel{background:var(--ember);border-color:var(--ember);color:#fff}
#otherWrap{margin-top:10px}
.submit{
  width:100%;margin-top:22px;border-radius:14px;padding:15px;font-family:var(--head);font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(180deg, var(--ember2), var(--ember));
  box-shadow:0 14px 30px -12px rgba(255,107,26,.9), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .1s, filter .2s
}
.submit:active{transform:scale(.98)}
.submit[disabled]{filter:grayscale(.6) brightness(.8);cursor:wait}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:0}
.mine-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:10px 12px;border-radius:12px;
  background:rgba(127,216,143,.08);border:1px solid rgba(127,216,143,.3);color:var(--ok);font-weight:600;font-size:14px
}
.mine-bar button{margin-inline-start:auto;color:var(--danger);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- list ---------- */
.row{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)
}
.row:first-child{border-top:0;padding-top:2px}
.row .n{
  flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);font-family:var(--head);font-weight:700;font-size:13px;color:var(--muted)
}
.row .main{flex:1;min-width:0}
.row .nm{font-family:var(--head);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.row .nm .me{font-family:var(--body);font-size:11px;font-weight:700;color:var(--bg);background:var(--ok);border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.row .bd{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.b{font-size:13px;font-weight:600;border-radius:8px;padding:2px 9px;background:rgba(255,107,26,.12);border:1px solid rgba(255,107,26,.3)}
.b.dr{background:rgba(120,170,255,.1);border-color:rgba(120,170,255,.3)}
.row .pl{color:var(--muted);font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.row .tot{flex:none;text-align:center;min-width:44px}
.row .tot b{display:block;font-family:var(--head);font-weight:900;font-size:24px;line-height:1.2;color:var(--amber);font-variant-numeric:tabular-nums}
.row .tot small{color:var(--dim);font-size:11px}
.row.mine{background:linear-gradient(90deg, transparent, rgba(127,216,143,.06), transparent)}
.adm{color:var(--danger);font-size:12px;font-weight:600;text-decoration:underline;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:18px 0 8px}
.status{text-align:center;color:var(--dim);font-size:12px;margin-top:22px}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-inline-end:6px;vertical-align:1px;box-shadow:0 0 8px var(--ok)}
.status.off i{background:var(--danger);box-shadow:0 0 8px var(--danger)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:#2c1f17;border:1px solid var(--line2);color:var(--text);font-weight:600;font-size:15px;
  padding:12px 20px;border-radius:14px;box-shadow:0 20px 40px -10px rgba(0,0,0,.7);
  transition:opacity .25s, transform .25s;z-index:20;max-width:calc(100% - 32px);text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="embers" id="embers"></div>
    <div class="grate"></div>
    <svg class="flame" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4d0d"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc25a"/><stop offset="1" stop-color="#fff1c2"/></linearGradient>
      </defs>
      <path class="f1" fill="url(#g1)" d="M32 4c3 10 14 15 14 30a14 14 0 0 1-28 0c0-7 3-11 6-14 0 5 2 8 5 9-1-10 1-18 3-25z"/>
      <path class="f2" fill="url(#g2)" d="M32 30c2 5 7 8 7 15a7 7 0 0 1-14 0c0-4 2-6 4-8 0 3 1 4 2 5 0-5 0-9 1-12z"/>
      <rect x="10" y="54" width="44" height="4" rx="2" fill="#4d3627"/>
    </svg>
    <div class="eyebrow">طلبات البرجر والمشروبات</div>
    <h1>فعالية شواء <span>الخميس</span></h1>
    <p class="sub">اكتب اسمك واختر طلبك، والكل يشوف الطلبات تحت</p>
  </header>

  <!-- ===== totals ===== -->
  <section class="card" id="totals">
    <div class="big">
      <div>
        <div class="big-num" id="tAll">0</div>
        <div class="big-lbl">إجمالي البرجر</div>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>

    <div class="sec-lbl">المشروبات</div>
    <div class="chips" id="tDrinks"><span class="none">لا يوجد</span></div>

    <div class="sec-lbl">مقترحات المكان</div>
    <div class="chips" id="tPlaces"><span class="none">لا يوجد</span></div>

    <div class="actions">
      <button class="btn-ghost" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        نسخ الملخص
      </button>
      <button class="btn-ghost" id="waBtn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>
        إرسال واتساب
      </button>
    </div>
  </section>

  <!-- ===== form ===== -->
  <section class="card" id="formCard">
    <div class="card-title"><span class="dot"></span><span id="formTitle">سجّل طلبك</span></div>

    <div class="mine-bar" id="mineBar" hidden>
      <span>✓ طلبك مسجّل، تقدر تعدّله وتضغط تحديث</span>
      <button type="button" id="delMine">حذف طلبي</button>
    </div>

    <form id="form" autocomplete="off" novalidate>
      <label class="fl" for="name">الاسم</label>
      <input class="inp" id="name" maxlength="30" placeholder="اكتب اسمك">

      <label class="fl">البرجر <small>اختر الصنف والعدد</small></label>
      <div id="items"></div>

      <label class="fl">المشروب</label>
      <div class="drinks" id="drinks"></div>
      <div id="otherWrap" hidden>
        <input class="inp" id="other" maxlength="30" placeholder="اكتب المشروب اللي تبيه">
      </div>

      <label class="fl" for="place">مقترح للمكان <small>من وين نطلب الأصناف؟</small></label>
      <input class="inp" id="place" maxlength="60" placeholder="اكتب اسم المطعم أو المكان (اختياري)">

      <div class="err" id="err" hidden></div>
      <button class="submit" id="submit" type="submit">سجّل طلبي</button>
    </form>
  </section>

  <!-- ===== list ===== -->
  <section class="card" id="listCard">
    <div class="card-title"><span class="dot"></span>الطلبات<span class="tag" id="listCount">0</span></div>
    <div id="list"><div class="empty">جاري التحميل…</div></div>
  </section>

  <div class="status" id="status"><i></i><span id="statusTxt">جاري الاتصال…</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var TOPIC = "thursday-bbq-ahd-e7fe902d22";
  var BASE = "https://ntfy.sh/" + TOPIC;
  var APP = "bbq1";
  var POLL_MS = 6000;
  var OTHER = "أخرى";

  var ITEMS = [
    {k:"meat",    name:"لحم",            short:"لحم",          ic:"🥩"},
    {k:"grilled", name:"صدر دجاج مشوي",  short:"صدر دجاج مشوي", ic:"🔥"},
    {k:"fried",   name:"دجاج مقلي",      short:"دجاج مقلي",     ic:"🍗"}
  ];
  var DRINKS = ["بيبسي","بيبسي دايت","سفن","سفن دايت", OTHER];
  var ADMIN = /admin/i.test(location.hash);

  /* ---------- storage helpers ---------- */
  var LS = {
    get:function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
    del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  var MY_KEY = "bbq_my_" + TOPIC;
  var my = LS.get(MY_KEY);           // {id, entry}
  var lastPublishAt = 0;

  /* ---------- state ---------- */
  var entries = new Map();           // id -> entry
  var loaded = false;
  var form = blankForm();

  function blankForm(){ return {name:"", items:{meat:0, grilled:0, fried:0}, drink:"", other:"", place:""}; }

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function clip(s, n){ s = String(s == null ? "" : s).replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n) : s; }
  function int(v){ v = parseInt(v, 10); return isFinite(v) ? Math.max(0, Math.min(10, v)) : 0; }
  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function norm(s){ return clip(s, 80).toLowerCase(); }

  // ASCII-only JSON so the message body is always stored as plain text
  var BS = String.fromCharCode(92);
  function asciiJSON(o){
    var s = JSON.stringify(o), out = "";
    for (var i = 0; i < s.length; i++){
      var c = s.charCodeAt(i);
      out += c > 126 ? BS + "u" + ("0000" + c.toString(16)).slice(-4) : s.charAt(i);
    }
    return out;
  }

  function clean(p){
    var items = {};
    ITEMS.forEach(function(it){ items[it.k] = int(p.items && p.items[it.k]); });
    var drink = DRINKS.indexOf(p.drink) >= 0 ? p.drink : "";
    return {
      id: String(p.id).slice(0, 40),
      name: clip(p.name, 30),
      items: items,
      drink: drink,
      other: drink === OTHER ? clip(p.other, 30) : "",
      place: clip(p.place, 60)
    };
  }
  function burgerCount(e){ return ITEMS.reduce(function(a, it){ return a + (e.items[it.k] || 0); }, 0); }
  function drinkLabel(e){ return e.drink === OTHER ? (e.other || OTHER) : e.drink; }

  /* ---------- network ---------- */
  function publish(payload){
    lastPublishAt = Date.now();
    return fetch(BASE, {method:"POST", body: asciiJSON(payload)}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  var polling = false;
  function refresh(){
    if (polling) return Promise.resolve();
    polling = true;
    return fetch(BASE + "/json?poll=1&since=all&_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(txt){
        var msgs = [];
        txt.split("\n").forEach(function(line){
          if (!line) return;
          try { var m = JSON.parse(line); if (m && m.event === "message" && m.message) msgs.push(m); } catch(e){}
        });
        msgs.forEach(function(m, i){ m._i = i; });
        msgs.sort(function(a, b){ return (a.time - b.time) || (a._i - b._i); });

        var map = new Map(), firstSeen = {}, tomb = {}, seen = {};
        msgs.forEach(function(m){
          var p; try { p = JSON.parse(m.message); } catch(e){ return; }
          if (!p || p.app !== APP || typeof p.id !== "string") return;
          seen[p.id] = true;
          if (p.del){ map.delete(p.id); tomb[p.id] = true; return; }
          if (tomb[p.id]) return;
          if (!firstSeen[p.id]) firstSeen[p.id] = m.time;
          var e = clean(p); e.first = firstSeen[p.id];
          if (e.name) map.set(p.id, e);
        });
        entries = map;
        loaded = true;
        setStatus(true);
        selfHeal(tomb, seen);
        renderAll();
      })
      .catch(function(){ setStatus(false); if (!loaded) renderList(); })
      .then(function(){ polling = false; });
  }

  // keep my own order alive (ntfy keeps messages ~12h) and respect deletions by the organiser
  function selfHeal(tomb, seen){
    if (!my || !my.id || !my.entry) return;
    if (tomb[my.id]){
      LS.del(MY_KEY); my = null; form = blankForm(); renderForm();
      toast("تم حذف طلبك من القائمة");
      return;
    }
    if (!seen[my.id] && Date.now() - lastPublishAt > 15000){
      publish(my.entry).then(function(){ refresh(); }).catch(function(){});
    }
  }

  function setStatus(ok){
    $("status").classList.toggle("off", !ok);
    $("statusTxt").textContent = ok ? "متصل • القائمة تتحدّث تلقائياً" : "تعذّر الاتصال… نحاول مرة ثانية";
  }

  /* ---------- render: totals ---------- */
  var prevTotals = {};
  function setNum(el, v){
    var key = el.id || el.getAttribute("data-k");
    el.textContent = v;
    if (prevTotals[key] !== undefined && prevTotals[key] !== v){
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
    }
    prevTotals[key] = v;
  }

  function totals(){
    var t = {all:0, people:0, items:{}, drinks:{}, places:{}};
    ITEMS.forEach(function(it){ t.items[it.k] = 0; });
    entries.forEach(function(e){
      t.people++;
      ITEMS.forEach(function(it){ t.items[it.k] += e.items[it.k] || 0; t.all += e.items[it.k] || 0; });
      if (e.drink){
        var d = drinkLabel(e), dk = norm(d);
        if (!t.drinks[dk]) t.drinks[dk] = {label:d, n:0, std: e.drink !== OTHER};
        t.drinks[dk].n++;
      }
      if (e.place){
        var pk = norm(e.place);
        if (!t.places[pk]) t.places[pk] = {label:e.place, n:0};
        t.places[pk].n++;
      }
    });
    return t;
  }

  function whoOrdered(k){
    return Array.from(entries.values())
      .filter(function(e){ return (e.items[k] || 0) > 0; })
      .sort(function(x, y){ return x.first - y.first; });
  }

  function sortedGroups(obj){
    return Object.keys(obj).map(function(k){ return obj[k]; }).sort(function(a, b){ return b.n - a.n; });
  }

  function renderTotals(){
    var t = totals();
    setNum($("tAll"), t.all);
    var tiles = $("tiles");
    if (!tiles.children.length){
      tiles.innerHTML = ITEMS.map(function(it){
        return '<div class="tile"><div class="tile-h"><span class="ic">' + it.ic + '</span><span class="nm">' + esc(it.name) + '</span>' +
          '<b data-k="t_' + it.k + '">0</b></div><div class="who" data-who="' + it.k + '" hidden></div></div>';
      }).join("");
    }
    ITEMS.forEach(function(it){
      setNum(tiles.querySelector('[data-k="t_' + it.k + '"]'), t.items[it.k]);
      var who = whoOrdered(it.k), box = tiles.querySelector('[data-who="' + it.k + '"]');
      box.hidden = !who.length;
      box.innerHTML = who.map(function(e){
        return '<span class="pc">' + esc(e.name) + ' <em>' + e.items[it.k] + '</em></span>';
      }).join("");
    });

    var dr = sortedGroups(t.drinks);
    $("tDrinks").innerHTML = dr.length ? dr.map(function(d){
      return '<span class="chip">' + esc(d.label) + ' <em>' + d.n + '</em></span>';
    }).join("") : '<span class="none">لا يوجد</span>';

    var pl = sortedGroups(t.places);
    $("tPlaces").innerHTML = pl.length ? pl.map(function(p){
      return '<span class="chip">' + esc(p.label) + ' <em>' + p.n + '</em></span>';
    }).join("") : '<span class="none">لا يوجد</span>';
  }

  /* ---------- render: list ---------- */
  function renderList(){
    var list = $("list");
    var arr = Array.from(entries.values()).sort(function(a, b){ return a.first - b.first; });
    $("listCount").textContent = arr.length;
    if (!loaded){ list.innerHTML = '<div class="empty">جاري التحميل…</div>'; return; }
    if (!arr.length){ list.innerHTML = '<div class="empty">لسا محد سجّل، كن أول واحد 🔥</div>'; return; }
    list.innerHTML = arr.map(function(e, i){
      var mine = my && my.id === e.id;
      var badges = ITEMS.filter(function(it){ return e.items[it.k] > 0; }).map(function(it){
        return '<span class="b">' + esc(it.short) + ' × ' + e.items[it.k] + '</span>';
      });
      if (e.drink) badges.push('<span class="b dr">🥤 ' + esc(drinkLabel(e)) + '</span>');
      return '<div class="row' + (mine ? ' mine' : '') + '">' +
        '<div class="n">' + (i + 1) + '</div>' +
        '<div class="main">' +
          '<div class="nm">' + esc(e.name) + (mine ? '<span class="me">أنت</span>' : '') + '</div>' +
          (badges.length ? '<div class="bd">' + badges.join("") + '</div>' : '') +
          (e.place ? '<div class="pl">📍 مقترح: ' + esc(e.place) + '</div>' : '') +
          (ADMIN ? '<button class="adm" type="button" data-del="' + esc(e.id) + '">حذف هذا الطلب</button>' : '') +
        '</div>' +
        '<div class="tot"><b>' + burgerCount(e) + '</b><small>برجر</small></div>' +
      '</div>';
    }).join("");
  }

  /* ---------- render: form ---------- */
  function buildForm(){
    $("items").innerHTML = ITEMS.map(function(it){
      var nums = "";
      for (var n = 1; n <= 10; n++) nums += '<button type="button" class="num" data-item="' + it.k + '" data-n="' + n + '">' + n + '</button>';
      return '<div class="item" data-box="' + it.k + '">' +
        '<div class="item-head"><span class="ic">' + it.ic + '</span><b>' + esc(it.name) + '</b>' +
        '<span class="cnt" data-cnt="' + it.k + '" hidden></span>' +
        '<button type="button" class="clr" data-clr="' + it.k + '" hidden>إلغاء</button></div>' +
        '<div class="nums">' + nums + '</div></div>';
    }).join("");
    $("drinks").innerHTML = DRINKS.map(function(d){
      return '<button type="button" class="pill" data-drink="' + esc(d) + '">' + esc(d) + '</button>';
    }).join("");
  }

  function renderForm(){
    $("name").value = form.name;
    $("other").value = form.other;
    $("place").value = form.place;
    ITEMS.forEach(function(it){
      var v = form.items[it.k] || 0;
      document.querySelector('[data-box="' + it.k + '"]').classList.toggle("on", v > 0);
      var c = document.querySelector('[data-cnt="' + it.k + '"]');
      c.hidden = !v; c.textContent = v;
      document.querySelector('[data-clr="' + it.k + '"]').hidden = !v;
      document.querySelectorAll('.num[data-item="' + it.k + '"]').forEach(function(b){
        b.classList.toggle("sel", +b.getAttribute("data-n") === v);
      });
    });
    document.querySelectorAll(".pill").forEach(function(b){
      b.classList.toggle("sel", b.getAttribute("data-drink") === form.drink);
    });
    $("otherWrap").hidden = form.drink !== OTHER;
    var has = !!(my && my.entry);
    $("mineBar").hidden = !has;
    $("formTitle").textContent = has ? "طلبك" : "سجّل طلبك";
    $("submit").textContent = has ? "تحديث طلبي" : "سجّل طلبي";
  }

  function renderAll(){ renderTotals(); renderList(); }

  /* ---------- events ---------- */
  function showErr(msg){ var e = $("err"); e.textContent = msg; e.hidden = !msg; }

  $("items").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-item")){
      var k = b.getAttribute("data-item"), n = +b.getAttribute("data-n");
      form.items[k] = form.items[k] === n ? 0 : n;
    } else if (b.hasAttribute("data-clr")){
      form.items[b.getAttribute("data-clr")] = 0;
    }
    showErr(""); renderForm();
  });
  $("drinks").addEventListener("click", function(ev){
    var b = ev.target.closest(".pill"); if (!b) return;
    var d = b.getAttribute("data-drink");
    form.drink = form.drink === d ? "" : d;
    renderForm();
    if (form.drink === OTHER) setTimeout(function(){ $("other").focus(); }, 50);
  });
  $("name").addEventListener("input", function(){ form.name = this.value; showErr(""); });
  $("other").addEventListener("input", function(){ form.other = this.value; });
  $("place").addEventListener("input", function(){ form.place = this.value; });

  $("form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = clip(form.name, 30);
    var total = ITEMS.reduce(function(a, it){ return a + (form.items[it.k] || 0); }, 0);
    if (!name){ showErr("اكتب اسمك أول"); $("name").focus(); return; }
    if (!total && !form.drink){ showErr("اختر البرجر والعدد أو المشروب"); return; }
    if (form.drink === OTHER && !clip(form.other, 30)){ showErr("اكتب اسم المشروب"); $("other").focus(); return; }

    var id = (my && my.id) || newId();
    var dup = Array.from(entries.values()).some(function(e){ return e.id !== id && norm(e.name) === norm(name); });
    if (dup && !confirm("فيه طلب مسجّل باسم «" + name + "». تبي تضيف طلب ثاني بنفس الاسم؟")) return;

    var payload = clean({id:id, name:name, items:form.items, drink:form.drink, other:form.other, place:form.place});
    payload.app = APP;
    var wasUpdate = !!(my && my.entry);
    var btn = $("submit"); btn.disabled = true; btn.textContent = "جاري الحفظ…";
    publish(payload).then(function(res){
      my = {id:id, entry:payload};
      LS.set(MY_KEY, my);
      var prev = entries.get(id);
      var e = clean(payload); e.first = prev ? prev.first : (res && res.time) || Math.floor(Date.now() / 1000);
      entries.set(id, e);
      form = {name:e.name, items:Object.assign({}, e.items), drink:e.drink, other:e.other, place:e.place};
      renderForm(); renderAll();
      toast(wasUpdate ? "تم تحديث طلبك ✓" : "تم تسجيل طلبك ✓");
      setTimeout(refresh, 1200);
    }).catch(function(){
      showErr("ما قدرنا نحفظ، تأكد من النت وجرّب مرة ثانية");
    }).then(function(){ btn.disabled = false; renderForm(); });
  });

  $("delMine").addEventListener("click", function(){
    if (!my || !confirm("متأكد تبي تحذف طلبك؟")) return;
    var id = my.id;
    publish({app:APP, id:id, del:true}).then(function(){
      entries.delete(id);
      LS.del(MY_KEY); my = null; form = blankForm();
      renderForm(); renderAll(); toast("تم حذف طلبك");
    }).catch(function(){ toast("ما قدرنا نحذف، جرّب مرة ثانية"); });
  });

  $("list").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-del]"); if (!b || !ADMIN) return;
    var id = b.getAttribute("data-del"), e = entries.get(id);
    if (!e || !confirm("حذف طلب «" + e.name + "»؟")) return;
    publish({app:APP, id:id, del:true, by:"admin"}).then(function(){
      entries.delete(id); renderAll(); toast("تم الحذف");
    }).catch(function(){ toast("ما قدرنا نحذف، جرّب مرة ثانية"); });
  });

  /* ---------- summary ---------- */
  function summary(){
    var t = totals(), lines = ["🔥 فعالية شواء الخميس", ""];
    lines.push("🍔 البرجر:");
    ITEMS.forEach(function(it){
      var who = whoOrdered(it.k).map(function(e){ return e.name + " " + e.items[it.k]; });
      lines.push("• " + it.name + ": " + t.items[it.k] + (who.length ? " (" + who.join("، ") + ")" : ""));
    });
    lines.push("الإجمالي: " + t.all);
    var dr = sortedGroups(t.drinks);
    if (dr.length){ lines.push("", "🥤 المشروبات:"); dr.forEach(function(d){ lines.push("• " + d.label + ": " + d.n); }); }
    var pl = sortedGroups(t.places);
    if (pl.length){ lines.push("", "📍 مقترحات المكان:"); pl.forEach(function(p){ lines.push("• " + p.label + " (" + p.n + ")"); }); }
    return lines.join("\n");
  }
  function copyText(s){
    if (navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(s).catch(function(){ return legacyCopy(s); });
    }
    return Promise.resolve(legacyCopy(s));
  }
  function legacyCopy(s){
    var ta = document.createElement("textarea");
    ta.value = s; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }
  $("copyBtn").addEventListener("click", function(){ copyText(summary()).then(function(){ toast("تم نسخ الملخص ✓"); }); });
  $("waBtn").addEventListener("click", function(){
    window.open("https://wa.me/?text=" + encodeURIComponent(summary()), "_blank");
  });

  /* ---------- toast ---------- */
  var toastT;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  /* ---------- embers ---------- */
  (function(){
    var box = $("embers"), html = "";
    for (var i = 0; i < 16; i++){
      var left = Math.round(Math.random() * 100), delay = (Math.random() * 6).toFixed(2), dur = (4 + Math.random() * 4).toFixed(2);
      var dx = Math.round(Math.random() * 60 - 30), sz = (2 + Math.random() * 4).toFixed(1);
      html += '<i style="left:' + left + '%;animation-delay:' + delay + 's;animation-duration:' + dur + 's;--dx:' + dx + 'px;width:' + sz + 'px;height:' + sz + 'px"></i>';
    }
    box.innerHTML = html;
  })();

  /* ---------- boot ---------- */
  buildForm();
  if (my && my.entry){
    var m = clean(my.entry);
    form = {name:m.name, items:Object.assign({}, m.items), drink:m.drink, other:m.other, place:m.place};
  }
  renderForm();
  renderAll();
  refresh();
  setInterval(function(){ if (!document.hidden) refresh(); }, POLL_MS);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) refresh(); });
})();
</script>
</body>
